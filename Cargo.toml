[package]
name = "SwitcherProgramm"
version = "0.1.0"
edition = "2021"

[dependencies]
tray-icon = "0.8"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Media_Audio",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Security",
    "implement",
] }
windows-core = "0.58"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
log = "0.4"
env_logger = "0.11"
thiserror = "2"

[profile.release]
panic = "abort"
strip = true
lto = "fat"
opt-level = "z"
codegen-units = 1
